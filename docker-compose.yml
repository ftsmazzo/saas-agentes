# docker-compose.yml para desenvolvimento/teste local
# Para produção, use EasyPanel

version: '3.8'

services:
  saas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-agentes
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

